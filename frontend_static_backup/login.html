<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>SmartHome Login</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      background: #f4f7fb;
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
      margin: 0;
    }

    .login-card {
      background: white;
      width: 360px;
      padding: 30px;
      border-radius: 12px;
      box-shadow: 0 8px 24px rgba(0,0,0,0.08);
    }

    h2 {
      margin-bottom: 5px;
      color: #1f2937;
    }

    p {
      color: #6b7280;
      font-size: 14px;
    }

    input {
      width: 100%;
      padding: 12px;
      margin-top: 12px;
      border: 1px solid #d1d5db;
      border-radius: 8px;
      box-sizing: border-box;
    }

    button {
      width: 100%;
      padding: 12px;
      margin-top: 18px;
      border: none;
      border-radius: 8px;
      background: #2563eb;
      color: white;
      font-weight: bold;
      cursor: pointer;
    }

    .error {
      color: #dc2626;
      margin-top: 12px;
      font-size: 14px;
    }

    .hint {
      margin-top: 16px;
      font-size: 13px;
      color: #6b7280;
      background: #f9fafb;
      padding: 10px;
      border-radius: 8px;
    }
  </style>
</head>
<body>
  <div class="login-card">
    <h2>SmartHome IoT</h2>
    <p>QA Automation Demo Login</p>

    <input id="email" type="email" placeholder="Email" value="admin@test.com" />
    <input id="password" type="password" placeholder="Password" value="admin123" />

    <button id="loginBtn" onclick="login()">Login</button>

    <div id="errorMsg" class="error"></div>

    <div class="hint">
      Demo credentials:<br>
      admin@test.com / admin123
    </div>
  </div>

  <script src="app.js"></script>
</body>
</html>
