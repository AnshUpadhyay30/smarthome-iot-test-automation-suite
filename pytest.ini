[pytest]
testpaths =
    automation/api_tests
    automation/db_tests
    automation/ui_tests
    automation/schema_tests
    automation/performance_tests

markers =
    api: API automation tests
    db: database validation tests
    ui: Playwright UI automation tests
    schema: API contract/schema validation tests
    performance: API performance smoke tests
    smoke: critical smoke tests
    negative: negative test scenarios
    boundary: boundary value tests